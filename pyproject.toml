[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "friendly-mailer"
version = "2.0"
description = "Review-first, AI-assisted personal emails sent through Gmail"
requires-python = ">=3.10"
dependencies = [
  "flask>=3.1.0,<4",
  "google-api-python-client>=2.160.0,<3",
  "google-auth-oauthlib>=1.2.1,<2",
  "openai>=1.68.0,<3",
]

[project.optional-dependencies]
dev = ["ruff>=0.9,<1"]

[project.scripts]
friendly-mailer = "friendly_mailer.cli:main"
friendly-mailer-dashboard = "friendly_mailer.web:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py310"
